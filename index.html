<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nos tables</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f6f1e9;--paper:#fffdf8;--ink:#2a1c1e;--muted:#80706b;--line:#e7ddd0;--soft:#f2e9dd;--wine:#7a1f3d;--wine-ink:#fff;--accent:#b5863a;--ok:#3d7a4c;--warn:#c47a17;--bad:#a63b3b;--idle:#8b8682;--shadow:0 1px 2px rgba(70,30,30,.05),0 6px 20px rgba(70,30,30,.06);--r:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171213;--paper:#211a1b;--ink:#f0e7e1;--muted:#a3948d;--line:#372c2d;--soft:#2b2223;--wine:#d0667f;--wine-ink:#1a1011;--accent:#d7a85a;--ok:#6fb07f;--warn:#e0a24a;--bad:#e07a7a;--idle:#9a948f;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171213;--paper:#211a1b;--ink:#f0e7e1;--muted:#a3948d;--line:#372c2d;--soft:#2b2223;--wine:#d0667f;--wine-ink:#1a1011;--accent:#d7a85a;--ok:#6fb07f;--warn:#e0a24a;--bad:#e07a7a;--idle:#9a948f;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;padding:22px 0 12px}
.logo{width:44px;height:44px;border-radius:50%;background:var(--wine);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px;stroke:var(--wine-ink)}
.brand{min-width:0}
.wordmark{height:54px;width:auto;display:block;color:var(--ink);margin-left:-4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mq{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand h1{font:600 30px/1.05 'Cormorant Garamond',Georgia,serif;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;color:var(--muted);font-size:13px}
.sp{flex:1}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button,.subtabs button{background:none;border:0;padding:10px 14px;font:500 14px Inter,system-ui,sans-serif;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
nav.tabs button.on,.subtabs button.on{color:var(--wine);border-color:var(--wine)}
.badge-n:not(:empty){background:var(--wine);color:var(--wine-ink);font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:999px;font:500 14px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:color-mix(in srgb,var(--wine) 45%,var(--line))}
.btn.primary{background:var(--wine);border-color:var(--wine);color:var(--wine-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.6;cursor:default}
.icon-btn{width:38px;height:38px;padding:0;justify-content:center;font-weight:700;letter-spacing:1px}
.pub.dirty::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:46px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:230px;z-index:1000}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;font:inherit;color:inherit;cursor:pointer}
.menu button:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:16px 0}
input,select,textarea{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
.toolbar input,.toolbar select{width:auto}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--wine) 30%,transparent);border-color:var(--wine)}
input[type=checkbox]{width:auto;accent-color:var(--wine)}
.search{flex:1 1 220px}
.count{font-size:13px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding-bottom:48px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.card.click{cursor:pointer;transition:transform .15s,border-color .15s}
.card.click:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--wine) 40%,var(--line))}
.card h3{margin:0;font:600 22px/1.15 'Cormorant Garamond',Georgia,serif}
.c-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.c-meta{color:var(--muted);font-size:13px}
.dist{color:var(--accent);font-weight:600}
.c-wines{display:flex;flex-wrap:wrap;gap:6px}
.wchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--soft);border-radius:999px;padding:3px 10px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.c-foot{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:9px;margin-top:auto}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.muted{color:var(--muted)}.small{font-size:13px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty.small{padding:24px}
.banner{background:color-mix(in srgb,var(--accent) 13%,var(--paper));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:12px;padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
#map{height:calc(100vh - 240px);min-height:380px;border-radius:var(--r);border:1px solid var(--line);margin-bottom:40px;z-index:0}
.leaflet-popup-content{font:13px/1.45 Inter,system-ui,sans-serif}
.leaflet-popup-content b{font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font:600 32px/1.1 'Cormorant Garamond',Georgia,serif;color:var(--wine)}
.kpi span{font-size:12.5px;color:var(--muted)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;padding-bottom:48px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.panel h4{margin:0 0 12px;font:600 19px 'Cormorant Garamond',Georgia,serif}
.bar-row{display:grid;grid-template-columns:minmax(90px,40%) 1fr auto;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.bt{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--wine);border-radius:6px}
.bv{font-variant-numeric:tabular-nums;color:var(--muted);min-width:34px;text-align:right}
.cols{display:flex;align-items:stretch;gap:5px;height:160px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:10.5px;color:var(--muted);min-width:0}
.col i{width:100%;background:var(--wine);border-radius:5px 5px 2px 2px;min-height:2px;opacity:.9}
.col em{font-style:normal;color:var(--ink);font-size:11px}
.w-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;background:var(--soft);border-radius:10px;padding:10px 4px}
.w-stats b{display:block;font:600 20px 'Cormorant Garamond',Georgia,serif}
.w-stats span{font-size:11px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:12.5px;color:var(--wine);text-decoration:none;background:color-mix(in srgb,var(--wine) 8%,transparent);padding:2px 9px;border-radius:999px}
.archived{opacity:.55}
.list-row{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.list-row:hover{border-color:color-mix(in srgb,var(--wine) 40%,var(--line))}
.chev{color:var(--muted);font-size:20px}
h3.sec{font:600 21px 'Cormorant Garamond',Georgia,serif;margin:22px 0 10px}
h3.sec small{font:400 13px Inter,system-ui,sans-serif;color:var(--muted);margin-left:6px}
dialog{border:0;padding:0;border-radius:18px;background:var(--paper);color:var(--ink);width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(30,15,18,.45)}
.m{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.m-head{display:flex;align-items:center;gap:10px;padding:18px 20px 8px}
.m-head h2{margin:0;font:600 25px/1.1 'Cormorant Garamond',Georgia,serif;flex:1;min-width:0}
.subtabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.m-body{padding:18px 20px;overflow:auto;flex:1}
.m-foot{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);align-items:center;flex:none}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.form .full{grid-column:1/-1}
.form h5{grid-column:1/-1;margin:8px 0 -4px;font:600 13px Inter,system-ui,sans-serif;color:var(--ink)}
label.chk{flex-direction:row!important;align-items:center;gap:6px!important;font-size:13px;color:var(--ink)!important;white-space:nowrap}
.rows .row{display:grid;grid-template-columns:1fr 120px auto auto;gap:8px;align-items:center;margin-bottom:8px}
.rows .hdr{font-size:12px;color:var(--muted);margin-bottom:4px}
.addrow{display:grid;grid-template-columns:140px 1fr 100px;gap:8px;margin-bottom:14px}
.addrow .full{grid-column:1/-1;display:flex;gap:8px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t td,.t th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.t th{font-size:12px;color:var(--muted);font-weight:500}
.jr{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:10px 0;display:flex;gap:8px}
.jr div{flex:1;white-space:pre-wrap}
.jr time{display:block;font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9999;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:640px){
 .form{grid-template-columns:1fr}
 .brand h1{font-size:24px}.brand p{display:none}
 .wordmark{height:40px}
 dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0}
 .m{max-height:100dvh;height:100%}
 .rows .row{grid-template-columns:1fr 84px auto auto}
 .addrow{grid-template-columns:1fr 90px}
 .addrow select{grid-column:1/-1;order:-1}
 .toolbar select{flex:1 1 140px}
 .grid{grid-template-columns:1fr}
 .w-stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

const TYPES = ['Gastronomique','Bistrot','Brasserie','Winstub','Bar à vins','Hôtel-restaurant','Traiteur','Caviste','Autre'];
const DISTS = ['','Assiette Michelin','Bib Gourmand','1 étoile','2 étoiles','3 étoiles','Gault&Millau'];

/* ───────── Utilitaires ───────── */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const isoLocal = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const today = () => isoLocal(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return isoLocal(d); };
const daysSince = s => Math.round((Date.parse(today() + 'T12:00') - Date.parse(s + 'T12:00')) / 864e5);
const fmtD = s => s ? new Date(s + 'T12:00').toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'}) : '—';
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const numOrNull = v => { v = String(v ?? '').trim().replace(',', '.'); if (v === '') return null; const n = parseFloat(v); return isNaN(n) ? null : n; };
const eur = n => (n == null || n === '' || isNaN(n)) ? '—' : Number(n).toLocaleString('fr-FR', {style:'currency', currency:'EUR', maximumFractionDigits: n % 1 ? 2 : 0});
const plural = (n, s, p) => n + ' ' + (n > 1 ? (p || s + 's') : s);
function ago(s) {
  const n = daysSince(s);
  if (n <= 0) return "aujourd'hui";
  if (n === 1) return 'hier';
  if (n < 31) return `il y a ${n} j`;
  if (n < 365) return `il y a ${Math.round(n / 30.4)} mois`;
  const y = Math.round(n / 36.5) / 10;
  return `il y a ${String(y).replace('.', ',')} an${y >= 2 ? 's' : ''}`;
}
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

/* ───────── Configuration & état ───────── */
function detectRepo() {
  const h = location.hostname;
  if (!h.endsWith('.github.io')) return {};
  const owner = h.split('.')[0];
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return {owner, repo: seg && !seg.endsWith('.html') ? seg : h};
}
let CFG = Object.assign({owner:'', repo:'', branch:'main', path:'index.html', relance:90}, detectRepo(), (() => { try { return JSON.parse(lsGet(LS_CFG) || '{}'); } catch (e) { return {}; } })());
let TOKEN = lsGet(LS_TOKEN) || '';
let S, PUB_TS, PUBBING = false;
let TAB = lsGet(LS_TAB) || 'tables';
const F = {q:'', statut:'', type:'', marque:'', vin:'', sort:'nom'};

function loadState() {
  let local = null;
  try { local = JSON.parse(lsGet(LS_DATA)); } catch (e) {}
  S = (local && (local._ts || 0) > (DATA_INIT._ts || 0)) ? local : clone(DATA_INIT);
  PUB_TS = Math.max(DATA_INIT._ts || 0, +(lsGet(LS_PUB) || 0));
  normalize();
}
function normalize() {
  S.domaine = S.domaine || {nom:'Mon domaine', sousTitre:''};
  S.vins = S.vins || []; S.restos = S.restos || []; S.marques = (S.marques && S.marques.length) ? S.marques : ['Sainte Joie', 'Arnta'];
  S.restos.forEach(r => { r.refs = r.refs || []; r.cmds = r.cmds || []; r.journal = r.journal || []; r.statut = r.statut || 'prospect'; });
}
function touch() { S._ts = Date.now(); lsSet(LS_DATA, JSON.stringify(S)); updatePub(); }
const isDirty = () => (S._ts || 0) > PUB_TS;

/* ───────── Dérivés ───────── */
const vinById = id => S.vins.find(v => v.id === id);
const vinLabel = v => v ? v.nom + (v.millesime ? ' ' + v.millesime : '') + (v.marque && S.vins.some(w => w !== v && w.nom === v.nom && w.marque !== v.marque) ? ' (' + v.marque + ')' : '') : 'Vin supprimé';
const vinDot = v => `<span class="dot" style="background:${COUL[v?.couleur] || '#bbb'}"></span>`;
const lastOrder = r => r.cmds.reduce((m, c) => c.date > m ? c.date : m, '') || null;
const bottles = (r, days, vin) => r.cmds.filter(c => (!days || daysSince(c.date) < days) && (!vin || c.vin === vin)).reduce((s, c) => s + (+c.qte || 0), 0);
const chipStatut = s => { const st = STATUTS[s] || STATUTS.prospect; return `<span class="chip" style="--c:${st.c}">${st.l}</span>`; };
const opt = (v, cur, label) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(label ?? (v || '—'))}</option>`;

function relances() {
  const N = +CFG.relance || 90, t = today();
  const sansCde = S.restos.filter(r => r.statut === 'actif').map(r => ({r, lo: lastOrder(r)}))
    .filter(x => !x.lo || daysSince(x.lo) >= N).sort((a, b) => (a.lo || '').localeCompare(b.lo || ''));
  const prevues = S.restos.filter(r => r.relance && r.relance <= addDays(t, 7) && r.statut !== 'perdu').sort((a, b) => a.relance.localeCompare(b.relance));
  const urgent = new Set([...sansCde.map(x => x.r.id), ...prevues.filter(r => r.relance <= t).map(r => r.id)]);
  return {sansCde, prevues, urgent, N};
}

/* ───────── Rendu principal ───────── */
function render() {
  const nom = S.domaine.nom || 'Maison Meyer';
  document.title = nom + ' — Nos tables';
  $('#dname').textContent = nom;
  $('#dsub').textContent = S.domaine.sousTitre || 'Les tables qui servent nos vins';
  $$('nav.tabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === TAB));
  const n = relances().urgent.size; $('#nRel').textContent = n || '';
  const v = $('#view');
  if (TAB !== 'carte' && MAP) { MAP.remove(); MAP = null; }
  if (TAB === 'tables') { v.innerHTML = viewTables(); renderList(); }
  else if (TAB === 'carte') { v.innerHTML = viewCarte(); drawMap(); }
  else if (TAB === 'vins') v.innerHTML = viewVins();
  else if (TAB === 'relances') v.innerHTML = viewRelances();
  else if (TAB === 'stats') v.innerHTML = viewStats();
  updatePub();
}
function updatePub() {
  const b = $('#pub'), d = isDirty();
  b.disabled = PUBBING;
  b.classList.toggle('dirty', d && !PUBBING);
  b.classList.toggle('primary', d || PUBBING);
  b.textContent = PUBBING ? 'Publication…' : d ? 'Publier' : 'À jour ✓';
  b.title = d ? 'Des modifications sont enregistrées sur cet appareil mais pas encore en ligne.' : 'Tout est publié.';
}
function demoBanner() {
  return S._demo ? `<div class="banner">🍇 <span style="flex:1">Les <b>vins</b> sont ceux de vos deux boutiques, mais les <b>tables</b> sont des exemples inventés pour découvrir l'outil.</span><button class="btn sm" data-act="clear-demo">Effacer les tables d'exemple</button></div>` : '';
}

/* ── Tables ── */
function viewTables() {
  const types = [...new Set([...TYPES, ...S.restos.map(r => r.type)].filter(Boolean))];
  return demoBanner() + `<div class="toolbar">
    <input class="search" id="q" type="search" placeholder="Rechercher une table, une commune, un contact…" value="${esc(F.q)}">
    <select id="fSt"><option value="">Tous statuts</option>${Object.entries(STATUTS).map(([k, s]) => opt(k, F.statut, s.l)).join('')}</select>
    <select id="fTy"><option value="">Tous types</option>${types.map(t => opt(t, F.type)).join('')}</select>
    <select id="fMq"><option value="">Toutes marques</option>${S.marques.map(m => opt(m, F.marque)).join('')}</select>
    <select id="fVin"><option value="">Tous les vins</option>${S.vins.map(v => opt(v.id, F.vin, vinLabel(v))).join('')}</select>
    <select id="fSort">${[['nom','Nom'],['recent','Dernière commande'],['volume','Bouteilles (12 mois)'],['commune','Commune']].map(([k, l]) => opt(k, F.sort, 'Tri : ' + l)).join('')}</select>
    <button class="btn primary" data-act="new-resto">＋ Ajouter une table</button>
  </div><div id="list"></div>`;
}
function renderList() {
  const box = $('#list'); if (!box) return;
  if (!S.restos.length) { box.innerHTML = `<div class="empty"><p style="font:600 22px 'Cormorant Garamond',serif;color:var(--ink);margin:0 0 6px">Aucune table pour l'instant</p><p>Ajoute le premier restaurant qui sert tes vins.</p><button class="btn primary" data-act="new-resto">＋ Ajouter une table</button></div>`; return; }
  const q = norm(F.q);
  const list = S.restos.filter(r => (!F.statut || r.statut === F.statut) && (!F.type || r.type === F.type) && (!F.vin || r.refs.some(x => x.vin === F.vin)) && (!F.marque || r.refs.some(x => vinById(x.vin)?.marque === F.marque))
    && (!q || norm([r.nom, r.commune, r.cp, r.contact, r.tags, r.type].join(' ')).includes(q)));
  const byNom = (a, b) => (a.nom || '').localeCompare(b.nom || '', 'fr');
  const sorters = {nom: byNom, commune: (a, b) => (a.commune || '').localeCompare(b.commune || '', 'fr') || byNom(a, b),
    recent: (a, b) => (lastOrder(b) || '').localeCompare(lastOrder(a) || '') || byNom(a, b), volume: (a, b) => bottles(b, 365) - bottles(a, 365) || byNom(a, b)};
  list.sort(sorters[F.sort] || byNom);
  box.innerHTML = list.length ? `<div class="count muted">${plural(list.length, 'table')}</div><div class="grid">${list.map(restoCard).join('')}</div>` : `<div class="empty">Aucune table ne correspond à ces filtres.</div>`;
}
function restoCard(r) {
  const lo = lastOrder(r), b = bottles(r, 365);
  const wines = r.refs.map(x => { const v = vinById(x.vin); return `<span class="wchip">${vinDot(v)}${esc(vinLabel(v))}${x.verre ? ' · verre' : ''}</span>`; }).join('');
  return `<article class="card click" data-act="open-resto" data-id="${r.id}">
    <div class="c-top"><h3>${esc(r.nom || 'Sans nom')}</h3>${chipStatut(r.statut)}</div>
    <div class="c-meta">${esc(r.commune || 'Commune ?')}${r.type ? ' · ' + esc(r.type) : ''}${r.distinction ? ` · <span class="dist">${esc(r.distinction)}</span>` : ''}</div>
    <div class="c-wines">${wines || '<span class="muted small">Aucun vin à la carte</span>'}</div>
    <div class="c-foot"><span>${plural(b, 'bouteille')} / 12 mois</span><span>${lo ? 'Commande ' + ago(lo) : 'Aucune commande'}</span></div>
  </article>`;
}

/* ── Carte ── */
let MAP = null;
function viewCarte() {
  const sans = S.restos.filter(r => !(r.lat && r.lng));
  return `<div class="toolbar"><span class="muted small">${plural(S.restos.length - sans.length, 'table')} sur la carte${sans.length ? ` · ${sans.length} sans position` : ''}</span>
    ${sans.length ? '<button class="btn sm" data-act="geocode-all">📍 Localiser les adresses manquantes</button>' : ''}
    <span class="sp"></span><div class="legend">${Object.values(STATUTS).map(s => `<span><span class="dot" style="background:${s.h}"></span>${s.l}</span>`).join('')}</div></div><div id="map"></div>`;
}
function drawMap() {
  const el = $('#map');
  if (typeof L === 'undefined') { el.innerHTML = '<div class="empty">La carte n\'a pas pu se charger (pas de connexion ?).</div>'; return; }
  if (MAP) { MAP.remove(); MAP = null; }
  MAP = L.map(el);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap'}).addTo(MAP);
  const pts = [];
  S.restos.filter(r => r.lat && r.lng).forEach(r => {
    const m = L.circleMarker([r.lat, r.lng], {radius: 9, color: '#fff', weight: 2, fillColor: (STATUTS[r.statut] || STATUTS.prospect).h, fillOpacity: .95}).addTo(MAP);
    const wines = r.refs.map(x => esc(vinLabel(vinById(x.vin)))).join(', ');
    m.bindPopup(`<b>${esc(r.nom)}</b><br><span style="color:#80706b">${esc(r.commune || '')}${r.type ? ' · ' + esc(r.type) : ''}</span>${wines ? '<br>' + wines : ''}<br><a href="#" data-pop="${r.id}">Ouvrir la fiche →</a>`);
    pts.push([r.lat, r.lng]);
  });
  MAP.on('popupopen', e => { const a = e.popup.getElement().querySelector('[data-pop]'); if (a) a.onclick = ev => { ev.preventDefault(); openResto(a.dataset.pop); }; });
  if (pts.length) MAP.fitBounds(pts, {padding: [40, 40], maxZoom: 12}); else MAP.setView([48.3, 7.45], 8);
  setTimeout(() => MAP && MAP.invalidateSize(), 60);
}
async function geocode(r) {
  const q = [r.adresse, r.cp, r.commune].filter(Boolean).join(', ');
  if (!q) return null;
  try {
    const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q), {headers: {'Accept-Language': 'fr'}});
    const j = await res.json();
    return j[0] ? [+(+j[0].lat).toFixed(5), +(+j[0].lon).toFixed(5)] : null;
  } catch (e) { return null; }
}
async function geocodeAll() {
  const todo = S.restos.filter(r => !(r.lat && r.lng));
  let ok = 0;
  for (let i = 0; i < todo.length; i++) {
    toast(`Localisation ${i + 1}/${todo.length}…`, 4000);
    const p = await geocode(todo[i]);
    if (p) { [todo[i].lat, todo[i].lng] = p; ok++; }
    if (i < todo.length - 1) await new Promise(res => setTimeout(res, 1100));
  }
  if (ok) touch();
  toast(ok === todo.length ? 'Toutes les tables sont localisées.' : `${ok}/${todo.length} localisées — complète l'adresse des autres.`);
  render();
}

/* ── Vins ── */
function wineStats(v) {
  const tables = S.restos.filter(r => r.refs.some(x => x.vin === v.id));
  const bt = S.restos.reduce((s, r) => s + bottles(r, 365, v.id), 0);
  const prix = tables.map(r => r.refs.find(x => x.vin === v.id).prixCarte).filter(x => x > 0);
  const moy = prix.length ? prix.reduce((a, b) => a + b, 0) / prix.length : null;
  return {tables, actives: tables.filter(r => r.statut === 'actif').length, bt, moy, coef: moy && v.prixPro ? moy / v.prixPro : null, verre: tables.filter(r => r.refs.find(x => x.vin === v.id).verre).length};
}
function viewVins() {
  const head = `<div class="toolbar"><span class="muted small">${plural(S.vins.length, 'vin')} au catalogue</span><span class="sp"></span><button class="btn primary" data-act="new-vin">＋ Ajouter un vin</button></div>`;
  if (!S.vins.length) return demoBanner() + head + `<div class="empty">Commence par ajouter les vins de ton domaine : ils serviront ensuite pour les cartes et les commandes.</div>`;
  const sortV = arr => [...arr].sort((a, b) => (b.actif !== false) - (a.actif !== false) || a.nom.localeCompare(b.nom, 'fr'));
  const card = v => {
    const s = wineStats(v);
    return `<article class="card ${v.actif === false ? 'archived' : ''}">
      <div class="c-top"><h3 style="display:flex;align-items:center;gap:8px">${vinDot(v)}${esc(vinLabel(v))}</h3><button class="btn ghost sm" data-act="edit-vin" data-id="${v.id}">Modifier</button></div>
      <div class="c-meta">${v.marque ? `<span class="mq">${esc(v.marque)}</span> · ` : ''}${esc(v.couleur || '')}${v.cepage ? ' · ' + esc(v.cepage) : ''} · prix pro ${v.prixPro ? eur(v.prixPro) : '<i>à renseigner</i>'}${v.actif === false ? ' · <b>épuisé / archivé</b>' : ''}${v.com ? `<br>${esc(v.com)}` : ''}</div>
      <div class="w-stats"><div><b>${s.tables.length}</b><span>table${s.tables.length > 1 ? 's' : ''} (${s.actives} active${s.actives > 1 ? 's' : ''})</span></div><div><b>${s.bt}</b><span>bt / 12 mois</span></div><div><b>${s.moy ? eur(Math.round(s.moy)) : '—'}</b><span>prix carte moyen</span></div><div><b>${s.coef ? '×' + s.coef.toFixed(1).replace('.', ',') : '—'}</b><span>coefficient</span></div></div>
      ${s.tables.length ? `<div class="links">${s.tables.map(r => `<a href="#" data-act="open-resto" data-id="${r.id}">${esc(r.nom)}</a>`).join('')}</div>` : '<span class="muted small">Pas encore à la carte d\'une table.</span>'}
    </article>`;
  };
  const groups = [...S.marques, ...new Set(S.vins.map(v => v.marque).filter(m => m && !S.marques.includes(m)))];
  const sec = (titre, arr) => arr.length ? `<h3 class="sec">${esc(titre)} <small>${plural(arr.length, 'vin')}</small></h3><div class="grid" style="padding-bottom:8px">${sortV(arr).map(card).join('')}</div>` : '';
  return demoBanner() + head + groups.map(g => sec(g, S.vins.filter(v => v.marque === g))).join('') + sec('Sans marque', S.vins.filter(v => !v.marque || !groups.includes(v.marque))) + '<div style="height:40px"></div>';
}

/* ── Relances ── */
function relRow(r, info) {
  return `<div class="list-row" data-act="open-resto" data-id="${r.id}" data-tab="journal"><div style="flex:1;min-width:0"><b>${esc(r.nom)}</b> <span class="muted">· ${esc(r.commune || '')}</span><div class="muted small">${info}</div></div>${chipStatut(r.statut)}<span class="chev">›</span></div>`;
}
function viewRelances() {
  const {sansCde, prevues, N} = relances(), t = today();
  const prospects = S.restos.filter(r => r.statut === 'prospect');
  const lastJ = r => r.journal.reduce((m, j) => j.date > m.date ? j : m, {date: ''});
  let h = '';
  h += `<h3 class="sec">Relances prévues <small>en retard ou dans les 7 jours</small></h3>`;
  h += prevues.length ? prevues.map(r => relRow(r, (r.relance < t ? `⚠️ prévue le ${fmtD(r.relance)} (${ago(r.relance)})` : r.relance === t ? "📅 prévue aujourd'hui" : `📅 prévue le ${fmtD(r.relance)}`))).join('') : '<p class="muted small">Rien de prévu cette semaine.</p>';
  h += `<h3 class="sec">Clients sans commande <small>depuis plus de ${N} jours</small></h3>`;
  h += sansCde.length ? sansCde.map(({r, lo}) => relRow(r, lo ? `Dernière commande ${ago(lo)} (${fmtD(lo)}) · ${plural(bottles(r, 365), 'bouteille')} sur 12 mois` : 'Aucune commande enregistrée')).join('') : '<p class="muted small">Tous les clients actifs ont commandé récemment. 🍷</p>';
  h += `<h3 class="sec">Prospects <small>${prospects.length}</small></h3>`;
  h += prospects.length ? prospects.map(r => { const j = lastJ(r); return relRow(r, j.date ? `Dernier échange ${ago(j.date)} : ${esc(j.txt.slice(0, 90))}${j.txt.length > 90 ? '…' : ''}` : 'Aucun échange noté'); }).join('') : '<p class="muted small">Aucun prospect en cours.</p>';
  return h + '<div style="height:40px"></div>';
}

/* ── Statistiques ── */
function bars(rows, fmt) {
  if (!rows.length) return '<p class="muted small">Pas encore de données.</p>';
  const max = Math.max(1, ...rows.map(r => r.v));
  return rows.map(r => `<div class="bar-row"><span class="bl" title="${esc(r.k)}">${r.dot || ''}${esc(r.k)}</span><span class="bt"><i style="width:${(r.v / max * 100).toFixed(1)}%;${r.c ? 'background:' + r.c : ''}"></i></span><span class="bv">${fmt ? fmt(r.v) : r.v}</span></div>`).join('');
}
function viewStats() {
  const actifs = S.restos.filter(r => r.statut === 'actif');
  const bt12 = S.restos.reduce((s, r) => s + bottles(r, 365), 0);
  const ca12 = S.restos.reduce((s, r) => s + r.cmds.filter(c => daysSince(c.date) < 365).reduce((a, c) => a + (+c.qte || 0) * (+(vinById(c.vin)?.prixPro) || 0), 0), 0);
  const coefs = []; S.restos.forEach(r => r.refs.forEach(x => { const v = vinById(x.vin); if (x.prixCarte > 0 && v?.prixPro > 0) coefs.push(x.prixCarte / v.prixPro); }));
  const coef = coefs.length ? coefs.reduce((a, b) => a + b, 0) / coefs.length : null;
  const refs = S.restos.reduce((s, r) => s + r.refs.length, 0);
  // 12 derniers mois
  const months = [];
  for (let i = 11; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); months.push({k: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'), l: d.toLocaleDateString('fr-FR', {month: 'short'}).replace('.', ''), v: 0}); }
  S.restos.forEach(r => r.cmds.forEach(c => { const m = months.find(m => m.k === c.date.slice(0, 7)); if (m) m.v += +c.qte || 0; }));
  const mMax = Math.max(1, ...months.map(m => m.v));
  const parVin = S.vins.map(v => ({k: vinLabel(v), v: S.restos.reduce((s, r) => s + bottles(r, 365, v.id), 0), c: COUL[v.couleur], dot: vinDot(v)})).filter(x => x.v).sort((a, b) => b.v - a.v);

/* ───────── Publication GitHub ───────── */
function b64dec(b64) { const bin = atob(b64.replace(/\s/g, '')); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function b64enc(str) { const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(bin); }
const safeJSON = o => JSON.stringify(o).replace(/<\//g, '<\\/').replace(/\*\//g, '*\\/');
async function publish() {
  if (!isDirty()) { toast('Tout est déjà en ligne.'); return; }
  if (!CFG.owner || !CFG.repo) { openSettings('Indique le compte et le dépôt GitHub pour publier.'); return; }
  if (!TOKEN) { openSettings('Ajoute un jeton GitHub pour publier.'); return; }
  PUBBING = true; updatePub();
  try {
    const url = `https://api.github.com/repos/${encodeURIComponent(CFG.owner)}/${encodeURIComponent(CFG.repo)}/contents/${CFG.path.split('/').map(encodeURIComponent).join('/')}`;
    const h = {Authorization: 'Bearer ' + TOKEN, Accept: 'application/vnd.github+json'};
    const g = await fetch(url + '?ref=' + encodeURIComponent(CFG.branch) + '&t=' + Date.now(), {headers: h, cache: 'no-store'});
    if (!g.ok) throw new Error(g.status === 401 ? 'jeton refusé' : g.status === 404 ? 'dépôt ou fichier introuvable' : 'lecture impossible (' + g.status + ')');
    const j = await g.json();
    const html = b64dec(j.content);
    const m = html.match(RE_DATA);
    if (!m) throw new Error('marqueur de données introuvable dans le fichier en ligne');
    let remote = {}; try { remote = JSON.parse(m[1]); } catch (e) {}
    if ((remote._ts || 0) > PUB_TS && remote._ts !== S._ts) {
      if (!confirm('La version en ligne a été modifiée depuis un autre appareil après ta dernière publication.\n\nPublier quand même et remplacer cette version ?')) { PUBBING = false; updatePub(); return; }
    }
    const out = html.replace(RE_DATA, () => MK1 + safeJSON(S) + MK2);
    const p = await fetch(url, {method: 'PUT', headers: h, body: JSON.stringify({message: 'Mise à jour des tables — ' + new Date().toLocaleString('fr-FR'), content: b64enc(out), sha: j.sha, branch: CFG.branch})});
    if (!p.ok) throw new Error(p.status === 409 ? 'conflit, réessaie dans un instant' : 'écriture refusée (' + p.status + ')');
    PUB_TS = S._ts; lsSet(LS_PUB, String(PUB_TS));
    toast('Publié ✓ — le site en ligne sera à jour d\'ici une minute.', 3500);
  } catch (e) {
    toast('Publication impossible : ' + e.message, 5000);
  }
  PUBBING = false; updatePub();
}

/* ───────── Exports / imports ───────── */
function download(content, name, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], {type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function exportCSV() {
  const head = ['Nom', 'Statut', 'Type', 'Distinction', 'Adresse', 'CP', 'Commune', 'Interlocuteur', 'Téléphone', 'E-mail', 'Marques', 'Vins à la carte', 'Bouteilles 12 mois', 'Bouteilles total', 'Dernière commande', 'Prochaine relance', 'Notes'];
  const rows = S.restos.map(r => [r.nom, (STATUTS[r.statut] || {}).l, r.type, r.distinction, r.adresse, r.cp, r.commune, r.contact, r.tel, r.email,
    [...new Set(r.refs.map(x => vinById(x.vin)?.marque).filter(Boolean))].join(', '), r.refs.map(x => vinLabel(vinById(x.vin)) + (x.prixCarte ? ` (${x.prixCarte} €)` : '')).join(' | '), bottles(r, 365), bottles(r), lastOrder(r) || '', r.relance, r.com]);
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(';')).join('\r\n');
  download(csv, `tables-${today()}.csv`, 'text/csv;charset=utf-8');
}
function importFile(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!Array.isArray(d.restos) || !Array.isArray(d.vins)) throw 0;
      if (!confirm(`Remplacer les données actuelles par cette sauvegarde (${plural(d.restos.length, 'table')}, ${plural(d.vins.length, 'vin')}) ?`)) return;
      S = d; normalize(); touch(); render(); toast('Sauvegarde restaurée. Pense à publier.');
    } catch (e) { toast('Ce fichier n\'est pas une sauvegarde valide.'); }
  };
  rd.readAsText(file);
}

  if (tab) { TAB = tab.dataset.tab; lsSet(LS_TAB, TAB); closeMenu(); render(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) { if (!e.target.closest('.menu-wrap')) closeMenu(); return; }
  const a = el.dataset.act, id = el.dataset.id;
  if (el.tagName === 'A') e.preventDefault();
  if (a !== 'menu') closeMenu();
  switch (a) {
    case 'menu': $('#menu').hidden = !$('#menu').hidden; break;
    case 'publish': publish(); break;
    case 'close': dlg.close(); break;
    case 'new-resto': openResto(null); break;
    case 'open-resto': openResto(id, el.dataset.tab); break;
    case 'sub': if (DT === 'infos') collect(); DT = el.dataset.t; renderRM(); break;
    case 'save-resto': saveResto(); break;
    case 'del-resto':
      if (confirm(`Supprimer « ${D.nom || 'cette table'} » et tout son historique ?`)) { S.restos = S.restos.filter(r => r.id !== D.id); touch(); dlg.close(); render(); toast('Table supprimée.'); }
      break;
    case 'add-ref': {
      const free = S.vins.find(v => v.actif !== false && !D.refs.some(x => x.vin === v.id)) || S.vins[0];
      D.refs.push({vin: free.id, prixCarte: null, verre: false}); renderRM(); break;
    }
    case 'del-ref': D.refs.splice(+el.dataset.i, 1); renderRM(); break;
    case 'add-cmd': {
      const qte = parseInt($('#cQte').value, 10), vin = $('#cVin').value, date = $('#cDate').value || today();
      if (!vin) { toast('Ajoute d\'abord un vin au catalogue.'); break; }
      if (!(qte > 0)) { toast('Indique le nombre de bouteilles.'); $('#cQte').focus(); break; }
      D.cmds.push({id: uid(), date, vin, qte, com: $('#cCom').value.trim()});
      const notes = [];
      if (!D.refs.some(x => x.vin === vin)) { D.refs.push({vin, prixCarte: null, verre: false}); notes.push('vin ajouté à la carte'); }
      if (D.statut === 'prospect') { D.statut = 'actif'; notes.push('passée en client actif'); }
      renderRM(); toast('Commande ajoutée' + (notes.length ? ' · ' + notes.join(', ') : '') + '.'); break;
    }
    case 'del-cmd': D.cmds = D.cmds.filter(c => c.id !== id); renderRM(); break;
    case 'add-jr': {
      const txt = $('#jTxt').value.trim(), rel = $('#jRel').value;
      if (!txt && rel === (D.relance || '')) { toast('Écris quelques mots sur l\'échange.'); break; }
      if (txt) D.journal.push({id: uid(), date: $('#jDate').value || today(), txt});
      D.relance = rel; renderRM(); break;
    }
    case 'del-jr': D.journal = D.journal.filter(j => j.id !== id); renderRM(); break;
    case 'geocode-one': (async () => { collect(); toast('Recherche de l\'adresse…'); const p = await geocode(D); if (p) { [D.lat, D.lng] = p; renderRM(); toast('Position trouvée.'); } else toast('Adresse introuvable — vérifie la commune.'); })(); break;
    case 'geocode-all': geocodeAll(); break;
    case 'new-vin': openVin(null); break;
    case 'edit-vin': openVin(id); break;
    case 'save-vin': saveVin(); break;
    case 'del-vin': if (confirm('Supprimer ce vin du catalogue ?')) { S.vins = S.vins.filter(v => v.id !== D.id); touch(); dlg.close(); render(); } break;
    case 'settings': openSettings(); break;
    case 'save-settings': saveSettings(); break;
    case 'clear-demo':
      if (confirm('Effacer les tables d\'exemple ? Les vins sont conservés.')) { S.restos = []; delete S._demo; touch(); if (dlg.open) dlg.close(); render(); toast('Tables d\'exemple effacées. À vous de jouer !'); }
      break;
    case 'reset-local':
      if (confirm('Revenir à la version publiée et perdre les modifications faites sur cet appareil depuis ?')) { lsDel(LS_DATA); loadState(); dlg.close(); render(); toast('Version publiée rechargée.'); }
      break;
    case 'export-csv': exportCSV(); break;
    case 'export-json': download(JSON.stringify(S, null, 2), `sauvegarde-tables-${today()}.json`, 'application/json'); break;
    case 'import-json': $('#fileIn').value = ''; $('#fileIn').click(); break;
    case 'theme': { const order = ['auto', 'light', 'dark']; const t = lsGet(LS_THEME) || 'auto'; lsSet(LS_THEME, order[(order.indexOf(t) + 1) % 3]); applyTheme(); break; }
  }
});
function onRefEdit(t) {
  if (t.dataset.ref === undefined || !D || MODE !== 'resto') return false;
  const x = D.refs[+t.dataset.ref], k = t.dataset.k; if (!x) return true;
  x[k] = t.type === 'checkbox' ? t.checked : k === 'prixCarte' ? numOrNull(t.value) : t.value;
  return true;
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { F.q = t.value; renderList(); return; }
  if (MODE === 'resto' && t.dataset.f === 'nom') { const h = $('#dlg .m-head h2'); if (h) h.textContent = t.value || 'Nouvelle table'; }
  onRefEdit(t);
});
document.addEventListener('change', e => {
  const t = e.target, map = {fSt: 'statut', fTy: 'type', fMq: 'marque', fVin: 'vin', fSort: 'sort'};
  if (map[t.id]) { F[map[t.id]] = t.value; renderList(); return; }
  if (t.id === 'fileIn') { importFile(t.files[0]); return; }
  onRefEdit(t);
});
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener('close', () => { MODE = null; D = null; });
document.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'n' && !e.metaKey && !e.ctrlKey && !e.altKey && !dlg.open && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); openResto(null); }
});

/* ───────── Démarrage ───────── */
loadState(); applyTheme(); render();
</script>
</body>
</html>
